[project]
name = "lumen-commerce"
version = "0.1.0"
description = "End-to-end ecommerce + analytics reference platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "bcrypt>=4.2",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "faker>=30.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
ml = [
    "prophet>=1.1.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
    "pandas-gbq>=0.24",
    "db-dtypes>=1.3",
]
airflow = [
    "apache-airflow>=2.10",
    "apache-airflow-providers-postgres>=5.13",
    "apache-airflow-providers-google>=10.24",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "locust>=2.31",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ml/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042: the model enums subclass (str, Enum) on purpose — SQLAlchemy's Enum
# column maps them by value and StrEnum changes str() output.
ignore = ["E501", "UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is built on calls in argument defaults.
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Form", "fastapi.Query"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
